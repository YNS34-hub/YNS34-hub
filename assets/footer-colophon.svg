  <rect width="1600" height="110" rx="16" fill="url(#footBg)" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="60" y1="1" x2="1540" y2="1" stroke="url(#footLine)" stroke-width="2"/>

  <g transform="translate(48, 44)">

<svg xmlns="http://www.w3.org/2000/svg" width="780" height="350" viewBox="0 0 780 350" role="img" aria-label="VOID//ECHO — Immersive Dark Cyber-Surreal 3D Experience">
  <defs>
    <linearGradient id="bgVoid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040812"/>
      <stop offset="100%" stop-color="#091522"/>
    </linearGradient>
    <radialGradient id="glowVoid" cx="84%" cy="24%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#040812" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderVoid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.45"/>
    </linearGradient>
    <pattern id="gridVoid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="clipVoid">
      <rect width="780" height="350" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipVoid)">
    <rect width="780" height="350" fill="url(#bgVoid)"/>
    <rect width="780" height="350" fill="url(#glowVoid)"/>
    <rect width="780" height="350" fill="url(#gridVoid)"/>

    <!-- Shader Wave-Interference & Spatial Ring Artwork (Top Right) -->
    <g transform="translate(528, 30)" fill="none" opacity="0.9">
      <ellipse cx="104" cy="64" rx="88" ry="26" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2" transform="rotate(-14 104 64)"/>
      <ellipse cx="104" cy="64" rx="72" ry="38" stroke="#06b6d4" stroke-opacity="0.5" stroke-width="1.4" transform="rotate(18 104 64)"/>
      <ellipse cx="104" cy="64" rx="48" ry="48" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 6"/>
      <circle cx="104" cy="64" r="16" fill="#10b981" fill-opacity="0.2" stroke="#6ee7b7" stroke-width="1.5"/>
      <circle cx="104" cy="64" r="4" fill="#ecfdf5"/>
      <text x="48" y="136" font-family="'JetBrains Mono', monospace" font-size="9.5" letter-spacing="2" fill="#34d399">SHADER // GLSL FIELD</text>
    </g>

    <!-- Index Badge -->
    <g transform="translate(42, 38)">
      <rect x="0" y="0" width="186" height="26" rx="13" fill="#06221e" stroke="#10b981" stroke-opacity="0.45"/>
      <text x="14" y="17" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" letter-spacing="1.8" fill="#34d399">SPATIAL 3D // 03</text>
    </g>

    <!-- Title & Subtitle -->
    <g transform="translate(42, 108)">
      <text x="0" y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.8" fill="#ffffff">VOID // ECHO</text>
      <text x="0" y="28" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="600" fill="#34d399">沉浸式暗黑超现实 3D 空间 · 实时着色器与滚动叙事</text>
    </g>

    <!-- Description -->
    <g transform="translate(42, 174)" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#94a3b8">
      <text x="0" y="0">A spatial-interface study built around <tspan fill="#e2e8f0" font-weight="600">real-time 3D scenes</tspan>, custom</text>
      <text x="0" y="23"><tspan fill="#e2e8f0" font-weight="600">GLSL shader-driven motion</tspan>, and <tspan fill="#6ee7b7" font-weight="600">scroll-synchronized narrative states</tspan></text>
      <text x="0" y="46">with dark cyber-surreal lighting and responsive camera choreography.</text>
    </g>

    <!-- Divider -->
    <line x1="42" y1="256" x2="738" y2="256" stroke="#1e293b" stroke-width="1"/>

    <!-- Tech Stack & Action Link -->
    <g transform="translate(42, 278)" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">
      <rect x="0" y="0" width="110" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="14" y="18" fill="#34d399">TypeScript</text>

      <rect x="122" y="0" width="142" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="136" y="18" fill="#e2e8f0">WebGL / Three.js</text>

      <rect x="276" y="0" width="132" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="290" y="18" fill="#67e8f9">GLSL Shaders</text>

      <text x="568" y="18" fill="#34d399" font-weight="600">EXPLORE REPO ↗</text>
    </g>
  </g>

  <rect x="1" y="1" width="778" height="348" rx="17" fill="none" stroke="url(#borderVoid)" stroke-width="2"/>
</svg>

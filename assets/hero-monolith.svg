<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-label="Jace (YNS34) — Mathematics × AI × Spatial Systems">
  <defs>
    <!-- Deep Obsidian Architectural Canvas -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03060c"/>
      <stop offset="45%" stop-color="#07101e"/>
      <stop offset="80%" stop-color="#050b16"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <!-- Atmospheric Nebula & Core Illumination -->
    <radialGradient id="nebulaCore" cx="76%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#1d6fa5" stop-opacity="0.34"/>
      <stop offset="35%" stop-color="#0f3b66" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#081b33" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#020409" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="amberGlow" cx="82%" cy="34%" r="28%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#d97706" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="leftSpot" cx="18%" cy="22%" r="45%">

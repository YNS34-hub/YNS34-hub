    <g transform="translate(104, 332)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" fill="#94a3b8">
      <text x="0" y="0">A curated laboratory of <tspan fill="#e2e8f0" font-weight="600">nonlinear mathematical instruments</tspan>, <tspan fill="#e2e8f0" font-weight="600">AI-verified</tspan></text>
      <text x="0" y="25"><tspan fill="#e2e8f0" font-weight="600">reasoning workflows</tspan>, and <tspan fill="#7dd3fc" font-weight="600">non-Euclidean 3D web architecture</tspan> — built around</text>

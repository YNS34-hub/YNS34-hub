      <line x1="0" y1="548" x2="1600" y2="548"/>
      <line x1="820" y1="68" x2="820" y2="548" stroke-dasharray="3 6"/>
      <line x1="72" y1="0" x2="72" y2="620"/>
    </g>

    <!-- Crosshair Registration Marks (+) -->
    <g stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="1.2">
      <path d="M67 68 H77 M72 63 V73"/>
      <path d="M815 68 H825 M820 63 V73"/>
      <path d="M67 548 H77 M72 543 V553"/>
      <path d="M815 548 H825 M820 543 V553"/>
      <path d="M1535 68 H1545 M1540 63 V73"/>
      <path d="M1535 548 H1545 M1540 543 V553"/>
    </g>

    <!-- Top Telemetry Bar (y = 0..68) -->
    <g font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" letter-spacing="2.4" fill="#94a3b8">
      <!-- Live Beacon -->
      <circle cx="104" cy="35" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="104" cy="35" r="8" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5">
        <animate attributeName="r" values="4;11;4" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="122" y="39" fill="#e2e8f0" font-weight="600">PERSONAL RESEARCH &amp; SPATIAL LAB</text>
      <text x="438" y="39" fill="#64748b">//</text>
      <text x="466" y="39" fill="#7dd3fc">INDEX : YNS34-HUB</text>
      <text x="845" y="39" fill="#94a3b8">LOC : 45.75°N, 126.63°E (HARBIN, CN)</text>
      <text x="1325" y="39" fill="#cbd5e1">EDITION // 2026.IV</text>
    </g>

    <!-- ============================================================ -->
    <!-- LEFT COLUMN : MONUMENTAL EDITORIAL TYPOGRAPHY & PIPELINE     -->
    <!-- ============================================================ -->

    <!-- Eyebrow Tag -->
    <g transform="translate(104, 110)">
      <rect x="0" y="0" width="336" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.38" stroke-width="1"/>
      <text x="16" y="18" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2.2" fill="#7dd3fc">00 // JACE (JIE TIAN) · ARCHITECT</text>
    </g>

    <!-- Primary Display Headlines -->
    <g transform="translate(100, 224)">

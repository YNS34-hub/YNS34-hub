        <text x="12" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fbbf24">04</text>
        <text x="12" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#ffffff">VERIFICATION</text>

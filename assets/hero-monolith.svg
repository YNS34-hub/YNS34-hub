    <!-- Right Margin Technical Pillars -->
    <g transform="translate(1418, 138)" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500" letter-spacing="2.8" fill="#94a3b8">
      <text x="0" y="0" fill="#7dd3fc">01 / MODELS</text>
      <text x="0" y="24">02 / ALGORITHMS</text>
      <text x="0" y="48">03 / MANIFOLDS</text>
      <text x="0" y="72">04 / SPATIAL 3D</text>
      <line x1="0" y1="90" x2="48" y2="90" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.5"/>

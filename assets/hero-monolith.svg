      <!-- Dashed Outer Trajectory -->
      <ellipse cx="1225" cy="288" rx="350" ry="165" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 9" transform="rotate(7 1225 288)"/>
    </g>


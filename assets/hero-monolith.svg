      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="28%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="72%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="orbitGradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.04"/>
      <stop offset="35%" stop-color="#7dd3fc" stop-opacity="0.65"/>
      <stop offset="65%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>

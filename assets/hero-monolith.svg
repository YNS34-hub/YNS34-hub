      <path d="M 1098 312 C 1144 278, 1190 266, 1236 268 C 1288 270, 1322 290, 1358 324" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1.2"/>
      <path d="M 1112 360 C 1164 330, 1228 328, 1290 348" stroke="#0284c7" stroke-opacity="0.22" stroke-width="1"/>
      <path d="M 1156 156 C 1122 206, 1108 260, 1116 316 C 1124 368, 1152 404, 1188 420" stroke="#7dd3fc" stroke-opacity="0.14" stroke-width="1"/>
      <path d="M 1282 160 C 1320 210, 1338 262, 1334 312 C 1330 362, 1312 396, 1288 416" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1"/>
      <ellipse cx="1174" cy="232" rx="56" ry="22" fill="#ffffff" fill-opacity="0.06" transform="rotate(-24 1174 232)"/>

      <stop offset="22%" stop-color="#bae6fd" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>

    <!-- Refractive Optical Glass Sphere -->
    <radialGradient id="glassSphere" cx="32%" cy="26%" r="76%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.96"/>
      <stop offset="14%" stop-color="#7dd3fc" stop-opacity="0.82"/>
      <stop offset="36%" stop-color="#0284c7" stop-opacity="0.65"/>
      <stop offset="68%" stop-color="#082f49" stop-opacity="0.94"/>
      <stop offset="90%" stop-color="#041322" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020810"/>
    </radialGradient>

    <radialGradient id="sphereSpecular" cx="24%" cy="18%" r="48%">

      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="68%" stop-color="#0369a1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.55"/>

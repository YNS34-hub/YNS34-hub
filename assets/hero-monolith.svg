      <path d="M 820 495 C 940 448, 1060 462, 1180 502 C 1300 542, 1440 488, 1600 455" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.4"/>
      <path d="M 820 514 C 955 470, 1085 486, 1205 520 C 1325 554, 1455 508, 1600 478" fill="none" stroke="#7dd3fc" stroke-opacity="0.22" stroke-width="1.1"/>
      <path d="M 820 532 C 970 494, 1105 508, 1230 536 C 1350 562, 1475 526, 1600 502" fill="none" stroke="#38bdf8" stroke-opacity="0.14" stroke-width="0.9"/>
    </g>

    <!-- Precision Coordinate Axes through Sphere Center (1225, 288) -->
    <g stroke="#64748b" stroke-opacity="0.28" stroke-width="1">
      <line x1="1225" y1="68" x2="1225" y2="548"/>
      <line x1="820" y1="288" x2="1600" y2="288"/>
      <!-- Degree Calibration Ring -->

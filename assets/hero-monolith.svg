      <text x="0" y="28" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="25" fill="#e2e8f0">f(x) = ∫<tspan font-size="15" dy="6">Ω</tspan><tspan dy="-6"> ℛ(x, θ) dμ(θ)</tspan></text>

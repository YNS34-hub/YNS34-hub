      <stop offset="45%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="75%" stop-color="#fef3c7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.04"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-label="Research Domains, Engineering Stack &amp; Working Principles">
  <defs>
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040811"/>
      <stop offset="50%" stop-color="#081120"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>

    <linearGradient id="matrixBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4"/>
    </linearGradient>

    <pattern id="matrixGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#94a3b8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <clipPath id="matrixClip">
      <rect width="1600" height="440" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#matrixClip)">
    <rect width="1600" height="440" fill="url(#matrixBg)"/>
    <rect width="1600" height="440" fill="url(#matrixGrid)"/>

    <!-- Top Header Strip -->
    <line x1="0" y1="64" x2="1600" y2="64" stroke="#1e293b" stroke-width="1.5"/>
    <g transform="translate(52, 38)" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="2.2">
      <text x="0" y="0" fill="#7dd3fc" font-weight="600">SYSTEM SPECIFICATION // ARCHITECTURE &amp; ETHOS</text>
      <text x="480" y="0" fill="#64748b">HARBIN UNIVERSITY OF SCIENCE AND TECHNOLOGY · PERSONAL LAB</text>
      <text x="1290" y="0" fill="#94a3b8">REV // 2026.10</text>
    </g>

    <!-- 3-Column Dividers -->
    <line x1="534" y1="64" x2="534" y2="440" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="1068" y1="64" x2="1068" y2="440" stroke="#1e293b" stroke-width="1.5"/>

    <!-- ============================================================ -->
    <!-- COLUMN I : MATHEMATICS & AI VERIFICATION                     -->
    <!-- ============================================================ -->
    <g transform="translate(52, 108)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#38bdf8">DOMAIN I // FORMAL &amp; ANALYTICAL</text>
      <text x="0" y="34" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Mathematics × AI Research</text>
      <text x="0" y="58" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#7dd3fc">非线性数学模型 · 审稿人优先验证体系 · 符号与数值分析</text>

      <!-- Spec Rows -->
      <g transform="translate(0, 90)" font-family="Inter, -apple-system, sans-serif" font-size="13.5" fill="#cbd5e1">
        <rect x="0" y="-16" width="430" height="44" rx="8" fill="#091323" stroke="#1e293b"/>
        <text x="16" y="4" font-weight="600" fill="#ffffff">Nonlinear Systems &amp; Optical Manifolds</text>
        <text x="16" y="21" font-size="11.5" fill="#94a3b8">Phase-space dynamics, biconcave refraction &amp; PDE visualization</text>

        <rect x="0" y="40" width="430" height="44" rx="8" fill="#091323" stroke="#1e293b"/>
        <text x="16" y="60" font-weight="600" fill="#ffffff">Reviewer-First Mathematical Audit</text>
        <text x="16" y="77" font-size="11.5" fill="#94a3b8">5-stage human-led verification controller for scientific manuscripts</text>

        <rect x="0" y="96" width="430" height="44" rx="8" fill="#091323" stroke="#1e293b"/>
        <text x="16" y="116" font-weight="600" fill="#ffffff">AI-Assisted Scientific Tooling</text>
        <text x="16" y="133" font-size="11.5" fill="#94a3b8">Deterministic audit workflows, structured prompts &amp; formal checks</text>
      </g>

      <text x="0" y="274" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">TOOLS : <tspan fill="#7dd3fc">Python · LaTeX · NumPy · Symbolic Audit</tspan></text>
    </g>

    <!-- ============================================================ -->
    <!-- COLUMN II : SPATIAL 3D & INTERACTIVE ENGINEERING             -->
    <!-- ============================================================ -->
    <g transform="translate(586, 108)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#34d399">DOMAIN II // SPATIAL COMPUTING</text>
      <text x="0" y="34" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Interactive 3D &amp; Visual Web</text>
      <text x="0" y="58" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#34d399">实时三维建筑空间 · 物理地形与运动学 · 杂志级视觉排版</text>

      <!-- Spec Rows -->
      <g transform="translate(0, 90)" font-family="Inter, -apple-system, sans-serif" font-size="13.5" fill="#cbd5e1">
        <rect x="0" y="-16" width="430" height="44" rx="8" fill="#091323" stroke="#1e293b"/>
        <text x="16" y="4" font-weight="600" fill="#ffffff">Real-Time WebGL2 &amp; Shader Architecture</text>
        <text x="16" y="21" font-size="11.5" fill="#94a3b8">PMREM glass, custom GLSL surfaces, sRGB color fidelity &amp; lightwells</text>

        <rect x="0" y="40" width="430" height="44" rx="8" fill="#091323" stroke="#1e293b"/>
        <text x="16" y="60" font-weight="600" fill="#ffffff">DEM Terrain &amp; Procedural Kinematics</text>
        <text x="16" y="77" font-size="11.5" fill="#94a3b8">10.17 km swisstopo elevation road cycling &amp; articulated court motion</text>

        <rect x="0" y="96" width="430" height="44" rx="8" fill="#091323" stroke="#1e293b"/>
        <text x="16" y="116" font-weight="600" fill="#ffffff">Hardware-Verified QA &amp; Performance</text>
        <text x="16" y="133" font-size="11.5" fill="#94a3b8">Automated multi-camera visual regression &amp; real GPU frame telemetry</text>
      </g>

      <text x="0" y="274" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">STACK : <tspan fill="#34d399">TypeScript · Three.js · React · GLSL · WebAudio</tspan></text>
    </g>

    <!-- ============================================================ -->
    <!-- COLUMN III : WORKING PRINCIPLES & RESEARCH ETHOS             -->
    <!-- ============================================================ -->
    <g transform="translate(1120, 108)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#fbbf24">DOMAIN III // OPERATING ETHOS</text>
      <text x="0" y="34" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Working Principles</text>
      <text x="0" y="58" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#fbbf24">清晰的问题定义 · 显式验证闭环 · 克制而诚实的交互设计</text>

      <!-- 4 Core Tenets -->
      <g transform="translate(0, 88)" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#e2e8f0">
        <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fbbf24">01 // INSTRUMENT, NOT AUTHORITY</text>
        <text x="0" y="20" fill="#94a3b8">Treat AI as a precision instrument under human verification.</text>

        <text x="0" y="54" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fbbf24">02 // EPISTEMIC HONESTY</text>
        <text x="0" y="74" fill="#94a3b8">Keep prototypes explicit about their maturity and physical limits.</text>

        <text x="0" y="108" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fbbf24">03 // REPRODUCIBLE RIGOR</text>
        <text x="0" y="128" fill="#94a3b8">Prefer deterministic, testable workflows over flashy one-off demos.</text>

        <text x="0" y="162" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fbbf24">04 // CURATED TAXONOMY</text>
        <text x="0" y="182" fill="#94a3b8">Separate original research, visual studies, and external forks clearly.</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1598" height="438" rx="19" fill="none" stroke="url(#matrixBorder)" stroke-width="2"/>
</svg>

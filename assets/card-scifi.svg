<svg xmlns="http://www.w3.org/2000/svg" width="780" height="350" viewBox="0 0 780 350" role="img" aria-label="SCI-FI WEB WORKS — 10-Piece Interactive Web Anthology">
  <defs>
    <linearGradient id="bgScifi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="100%" stop-color="#081226"/>
    </linearGradient>
    <radialGradient id="glowScifi" cx="85%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050914" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderScifi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.45"/>
    </linearGradient>
    <pattern id="gridScifi" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="clipScifi">
      <rect width="780" height="350" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipScifi)">
    <rect width="780" height="350" fill="url(#bgScifi)"/>
    <rect width="780" height="350" fill="url(#glowScifi)"/>
    <rect width="780" height="350" fill="url(#gridScifi)"/>

    <!-- Decorative 10-Piece Anthology Waveform / Chronology Motif (Top Right) -->
    <g transform="translate(520, 32)" opacity="0.88">
      <circle cx="110" cy="64" r="54" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3 5"/>
      <circle cx="110" cy="64" r="36" fill="none" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1"/>
      <!-- 10 Vertical Spectral Bars representing 10 Interactive Works -->
      <g fill="#38bdf8">
        <rect x="46" y="52" width="4" height="24" rx="2" opacity="0.45"/>
        <rect x="60" y="38" width="4" height="52" rx="2" opacity="0.65"/>
        <rect x="74" y="28" width="4" height="72" rx="2" opacity="0.85"/>
        <rect x="88" y="44" width="4" height="40" rx="2" opacity="0.6"/>
        <rect x="102" y="18" width="4" height="92" rx="2" fill="#7dd3fc"/>
        <rect x="116" y="32" width="4" height="64" rx="2" opacity="0.9"/>
        <rect x="130" y="46" width="4" height="36" rx="2" opacity="0.7"/>
        <rect x="144" y="26" width="4" height="76" rx="2" fill="#818cf8"/>
        <rect x="158" y="40" width="4" height="48" rx="2" opacity="0.65"/>
        <rect x="172" y="50" width="4" height="28" rx="2" opacity="0.45"/>
      </g>
      <text x="64" y="134" font-family="'JetBrains Mono', monospace" font-size="9.5" letter-spacing="2" fill="#7dd3fc">INDEX // I — X WORKS</text>
    </g>

    <!-- Index Badge -->
    <g transform="translate(42, 38)">
      <rect x="0" y="0" width="186" height="26" rx="13" fill="#0c192c" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="14" y="17" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" letter-spacing="1.8" fill="#7dd3fc">ANTHOLOGY // 02</text>
    </g>

    <!-- Title & Subtitle -->
    <g transform="translate(42, 108)">
      <text x="0" y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.8" fill="#ffffff">SCI-FI WEB WORKS</text>
      <text x="0" y="28" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="600" fill="#7dd3fc">原创科幻互动网页作品集 · 10 部独立交互实验</text>
    </g>

    <!-- Description -->
    <g transform="translate(42, 174)" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#94a3b8">
      <text x="0" y="0">A ten-piece anthology of speculative web studies exploring <tspan fill="#e2e8f0" font-weight="600">memory</tspan>,</text>
      <text x="0" y="23"><tspan fill="#e2e8f0" font-weight="600">observation, time, atmosphere, and choice</tspan> — featuring real-time UI</text>
      <text x="0" y="46">telemetry, atmospheric soundscapes, and interactive state machines.</text>
    </g>

    <!-- Divider -->
    <line x1="42" y1="256" x2="738" y2="256" stroke="#1e293b" stroke-width="1"/>

    <!-- Tech Stack & Action Link -->
    <g transform="translate(42, 278)" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">
      <rect x="0" y="0" width="110" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="14" y="18" fill="#7dd3fc">TypeScript</text>

      <rect x="122" y="0" width="142" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="136" y="18" fill="#e2e8f0">10 Interactive UI</text>

      <rect x="276" y="0" width="136" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="290" y="18" fill="#818cf8">Sci-Fi Narrative</text>

      <text x="568" y="18" fill="#38bdf8" font-weight="600">EXPLORE REPO ↗</text>
    </g>
  </g>

  <rect x="1" y="1" width="778" height="348" rx="17" fill="none" stroke="url(#borderScifi)" stroke-width="2"/>
</svg>

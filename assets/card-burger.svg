<svg xmlns="http://www.w3.org/2000/svg" width="780" height="350" viewBox="0 0 780 350" role="img" aria-label="BIG MOUTH BURGER INTELLIGENCE — 3D Interactive Commerce Study">
  <defs>
    <linearGradient id="bgBurger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09070c"/>
      <stop offset="100%" stop-color="#1a1118"/>
    </linearGradient>
    <radialGradient id="glowBurger" cx="85%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#09070c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderBurger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.45"/>
    </linearGradient>
    <pattern id="gridBurger" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="clipBurger">
      <rect width="780" height="350" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipBurger)">
    <rect width="780" height="350" fill="url(#bgBurger)"/>
    <rect width="780" height="350" fill="url(#glowBurger)"/>
    <rect width="780" height="350" fill="url(#gridBurger)"/>

    <!-- Exploded Isometric 3D Layer Rings (Top Right) -->
    <g transform="translate(534, 28)" fill="none" opacity="0.92">
      <ellipse cx="96" cy="36" rx="58" ry="18" stroke="#fbbf24" stroke-opacity="0.85" stroke-width="1.6"/>
      <ellipse cx="96" cy="58" rx="64" ry="20" stroke="#f97316" stroke-opacity="0.7" stroke-width="1.4" stroke-dasharray="5 4"/>
      <ellipse cx="96" cy="80" rx="60" ry="19" stroke="#34d399" stroke-opacity="0.65" stroke-width="1.4"/>
      <ellipse cx="96" cy="102" rx="58" ry="18" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.6"/>
      <line x1="96" y1="12" x2="96" y2="126" stroke="#fbbf24" stroke-opacity="0.35" stroke-dasharray="2 4"/>
      <text x="32" y="148" font-family="'JetBrains Mono', monospace" font-size="9.5" letter-spacing="2" fill="#fbbf24">3D LAYER // EXPLODED VIEW</text>
    </g>

    <!-- Index Badge -->
    <g transform="translate(42, 38)">
      <rect x="0" y="0" width="206" height="26" rx="13" fill="#271709" stroke="#f59e0b" stroke-opacity="0.45"/>
      <text x="14" y="17" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" letter-spacing="1.8" fill="#fbbf24">INTERACTIVE 3D // 05</text>
    </g>

    <!-- Title & Subtitle -->
    <g transform="translate(42, 108)">
      <text x="0" y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="29" font-weight="800" letter-spacing="-0.8" fill="#ffffff">BIG MOUTH BURGER</text>
      <text x="0" y="28" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="600" fill="#fbbf24">大嘴堡情报局 · 3D 交互品牌与视觉商务实验</text>
    </g>

    <!-- Description -->
    <g transform="translate(42, 174)" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#94a3b8">
      <text x="0" y="0">A speculative brand and spatial interface study exploring <tspan fill="#e2e8f0" font-weight="600">tactile 3D</tspan></text>
      <text x="0" y="23"><tspan fill="#e2e8f0" font-weight="600">product choreography</tspan>, <tspan fill="#fbbf24" font-weight="600">editorial commerce layouts</tspan>, and playful motion</text>
      <text x="0" y="46">design with high-contrast typography and interactive object inspection.</text>
    </g>

    <!-- Divider -->
    <line x1="42" y1="256" x2="738" y2="256" stroke="#1e293b" stroke-width="1"/>

    <!-- Tech Stack & Action Link -->
    <g transform="translate(42, 278)" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">
      <rect x="0" y="0" width="110" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="14" y="18" fill="#fbbf24">TypeScript</text>

      <rect x="122" y="0" width="142" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="136" y="18" fill="#e2e8f0">3D Product UI</text>

      <rect x="276" y="0" width="142" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="290" y="18" fill="#fdba74">Kinetic Motion</text>

      <text x="568" y="18" fill="#fbbf24" font-weight="600">EXPLORE REPO ↗</text>
    </g>
  </g>

  <rect x="1" y="1" width="778" height="348" rx="17" fill="none" stroke="url(#borderBurger)" stroke-width="2"/>
</svg>
